<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1021">
  <meta name="description" content="OUTLIER — Seven questions. Two ways to think. Can you outthink the crowd?">
  <meta property="og:title" content="OUTLIER — Outthink the crowd">
  <meta property="og:description" content="Four rare answers. Three crowd predictions. One daily brain battle.">
  <meta property="og:type" content="website">
  <title>OUTLIER — Outthink the crowd</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="starfield" aria-hidden="true"></div>
  <div class="shell">
    <header class="site-header">
      <button class="brand" type="button" data-action="home" aria-label="OUTLIER, home">
        <span class="brand-mark" aria-hidden="true"><span class="brand-spark">✦</span></span>
        <span class="brand-word">OUTLIER<span class="brand-dot">.</span></span>
      </button>
      <div class="header-actions">
        <button class="nav-link" type="button" data-action="leaderboard">My stats</button>
        <button class="nav-link nav-help" type="button" data-action="rules">How to play</button>
        <button class="sound-toggle" type="button" data-action="sound" aria-label="Enable sounds" title="Toggle sounds">
          <span id="sound-icon" aria-hidden="true">♪</span>
          <span class="sound-label">Sound off</span>
        </button>
      </div>
    </header>
    <main id="app" class="app" aria-live="polite">
      <div class="loading"><div class="spinner"></div><p>Booting up the brainwaves...</p></div>
    </main>
    <footer class="site-footer">
      <span>OUTLIER <span class="footer-star">✦</span> THINK DIFFERENT.</span>
      <span>Prototype v0.1 · Built for curious minds</span>
    </footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
