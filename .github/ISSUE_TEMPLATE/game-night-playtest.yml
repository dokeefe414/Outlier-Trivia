name: "Game Night Beta Report"
description: "Structured feedback on OUTLIER Pass & Play and private online rooms. No invite codes or personal details."
title: "[Game Night Beta] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing OUTLIER! Please report the *behavior*, not player names or answer keys. Do not post room codes, emails, account tokens, payment details, or full answer histories.
  - type: dropdown
    id: format
    attributes:
      label: Mode tested
      options:
        - Local Pass & Play (one device)
        - Online private room (multiple devices)
        - Answer recognition or review
        - Accessibility and mobile layout
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, browser and approximate browser version
      placeholder: "Example: Android 16, Chrome mobile / Windows, Edge"
    validations:
      required: true
  - type: dropdown
    id: party-size
    attributes:
      label: Players in your match
      options:
        - "2"
        - "3"
        - "4"
        - "5-8 local players"
        - "Not applicable"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: How did it go?
      options:
        - Completed without a problem
        - Confusing or frustrating behavior
        - Visual or accessibility issue
        - Lost progress or failed to reconnect
        - Wrong answer recognition
        - Other bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: What happened, and how can we reproduce it?
      description: "Include the screen/step, expected behavior and what actually happened."
      placeholder: "After question 3, I refreshed the page, pressed Resume Game Night, and..."
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What would make you want to play another game?
      description: "Pacing, reveal quality, answer fairness, or anything that could be improved."
    validations:
      required: false
  - type: input
    id: reference
    attributes:
      label: Public source URL (only for disputed answers)
      description: "Cite the exact eligibility requirement; never publish private future-ranked questions."
      placeholder: "https://..."
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and fair-play check
      options:
        - label: "I removed private names, invite codes, credentials, payment information and unpublished answer keys."
          required: true
