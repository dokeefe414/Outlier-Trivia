name: OUTLIER quality checks
on:
  push:
  pull_request:
jobs:
  browser-code:
    name: Browser logic and question bank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax and unit tests
        run: npm run check
      - name: Audit every accepted answer, alias and score range
        run: npm run audit:content

  edge-function:
    name: Hosted API type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno strict type check
        run: deno check supabase/functions/outlier/index.ts

  database:
    name: Postgres security and scoring smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outlier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d outlier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: outlier_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          fi
      - name: Bootstrap disposable Supabase auth test schema
        run: psql -v ON_ERROR_STOP=1 -f test/database-bootstrap.sql
      - name: Run hosted schema migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112000100_initial.sql
      - name: Import server-only question bank
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112000200_question_bank.sql
      - name: Import expanded 39-question answer atlas and online rotation
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112000300_answer_atlas.sql
      - name: Import v0.5 culture, wildlife and sports answer packs
        run: |
          for f in supabase/migrations/202611120004*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Apply weekly mixed-category daily schedule
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112000500_daily_content_schedule.sql
      - name: Apply friend leagues, historical insights and review migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112000600_friends_reviews.sql
      - name: Verify secure attempts, timers, purchase gating, and ranks
        run: psql -v ON_ERROR_STOP=1 -f test/database-smoke.sql
      - name: Verify secure friend leagues and historical crowd data
        run: psql -v ON_ERROR_STOP=1 -f test/competition-smoke.sql

      - name: Apply vetted v0.9 answer aliases to historical prototype bank
        run: |
          for f in supabase/migrations/202611120011*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Apply private ranked scoring security migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112000700_private_ranked_content.sql
      - name: Apply replay-safe Stripe billing lifecycle
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112000800_billing_lifecycle.sql
      - name: Apply private beta operations and release checks
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112000900_beta_operations.sql
      - name: Verify production ranked question bank defaults to empty
        run: |
          COUNT=$(psql -Atc 'select count(*) from private.ranked_question_bank')
          [ "$COUNT" = "0" ] || (echo "Ranked keys may be committed to public migrations!" && exit 1)
      - name: Seed disposable private question fixtures for integration tests only
        run: psql -v ON_ERROR_STOP=1 -f test/private-question-fixture.sql
      - name: Test sealed daily games, request limits, billing and beta metrics
        run: psql -v ON_ERROR_STOP=1 -f test/private-beta-smoke.sql
      - name: Apply v0.8 retry-in-place answer validation
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112001000_retry_unrecognized.sql
      - name: Verify invalid retry, accepted answer, manual skip and timeout
        run: psql -v ON_ERROR_STOP=1 -f test/retry-invalid-smoke.sql
      - name: Apply v0.9 owner review queue and audit trail
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112001200_review_admin.sql
      - name: Verify owner-only review decisions and score immutability
        run: psql -v ON_ERROR_STOP=1 -f test/review-admin-smoke.sql
      - name: Align hosted Unicode and alias normalization with guest game
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112001300_unicode_normalization.sql
      - name: Verify accented names, ligatures and ambiguous symbols
        run: psql -v ON_ERROR_STOP=1 -f test/unicode-normalization-smoke.sql

  browser-e2e:
    name: Desktop and mobile browser smoke
    needs: browser-code
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/outlier-server.log 2>&1 &
          sleep 2
      - name: Test seven questions, stats, guest persistence, and mobile view
        run: npm run test:browser
